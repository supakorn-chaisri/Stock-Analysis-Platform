name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  backend-test:
    name: Backend Tests (.NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stock_analysis_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d stock_analysis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore StockAnalysis.sln

      - name: Build
        run: dotnet build StockAnalysis.sln --no-restore -c Release

      - name: Test (Api.Tests)
        run: dotnet test tests/Api.Tests/StockAnalysis.Api.Tests.csproj --no-build -c Release --logger "trx;LogFileName=api-tests.trx" --collect:"XPlat Code Coverage"

      - name: Test (Etl.Tests)
        run: dotnet test tests/Etl.Tests/StockAnalysis.Etl.Tests.csproj --no-build -c Release --logger "trx;LogFileName=etl-tests.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/
            **/*.trx

  frontend-test:
    name: Frontend Tests (Next.js + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint

      - name: Type check
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Install Playwright
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  contract-test:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Pact CLI
        run: |
          curl -fsSL https://github.com/pact-foundation/pact-ruby-standalone/releases/download/v1.104.0/pact-1.104.0-linux-x86_64.tar.gz | tar xz -C /tmp
          echo "/tmp/pact-1.104.0/bin" >> $GITHUB_PATH

      - name: Run consumer tests (frontend)
        working-directory: ./web
        run: |
          npm ci
          npm run test:pact

      - name: Run provider tests (backend)
        run: |
          dotnet test tests/Api.Tests/StockAnalysis.Api.Tests.csproj --filter "FullyQualifiedName~Pact" -c Release

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Api/Dockerfile
          push: false
          tags: stock-analysis-api:latest
          load: true

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: Dockerfile
          push: false
          tags: stock-analysis-web:latest
          load: true

      - name: Test docker compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "Docker compose config valid"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/stock-analysis
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f