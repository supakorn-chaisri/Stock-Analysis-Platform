services:
  postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis:7-alpine
      command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
      volumes:
        - redis_data:/data

  api:
      build:
        context: .
        dockerfile: src/Api/Dockerfile
      environment:
        ASPNETCORE_ENVIRONMENT: Production
        ConnectionStrings__DefaultConnection: Host=postgres;Database=stock_analysis;Username=stock_user;Password=${POSTGRES_PASSWORD}
        ConnectionStrings__Redis: redis:6379
        Jwt__Key: ${JWT_KEY}
        Jwt__Issuer: StockAnalysis
        Jwt__Audience: StockAnalysisClients
        TwelveData__ApiKey: ${TWELVE_DATA_API_KEY}
        Gemini__ApiKey: ${GEMINI_API_KEY}
        SENDGRID_API_KEY: ${SENDGRID_API_KEY}
        SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      restart: unless-stopped

  web:
      build:
        context: ./web
        dockerfile: Dockerfile
      environment:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
        NODE_ENV: production
      restart: unless-stopped

  nginx:
      image: nginx:alpine
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./nginx/conf.d:/etc/nginx/conf.d:ro
        - ./certbot/conf:/etc/letsencrypt:ro
        - ./certbot/www:/var/www/certbot:ro
      restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:

networks:
  stock-network:
    driver: bridge